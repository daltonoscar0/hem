name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The CPU wheel is a few hundred megabytes against a couple of gigabytes
      # for the default CUDA build, and nothing in the test suite touches a GPU.
      - name: Install torch (CPU build)
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.9.*"

      - name: Install
        run: pip install -e ".[dev]"

      # No checkpoint and no corpus download. The dial is read from the
      # checked-in hem/levels.json, the language model in the surprisal tests is
      # stubbed, and everything else builds its own data.
      - name: Run tests
        run: pytest -q
